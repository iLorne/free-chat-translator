name: Private v0.7.0 Java 11 build and offline verification

on:
  push:
    branches:
      - private-build-verification-v0.7.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java11-verify:
    name: Build against RuneLite and run existing offline suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle 8.14.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.7'
      - name: Check release surface before compiling
        run: python3 offline-tests/check-release-surface.py
      - name: Run core offline checks (not gameplay)
        run: bash offline-tests/run-tests.sh
      - name: Run synthetic runtime checks (not native RuneLite)
        run: bash offline-tests/run-runtime-behavior-tests.sh
      - name: Run bounded-response checks
        run: bash offline-tests/check-response-bounds.sh
      - name: Clean compile against real RuneLite dependencies
        run: gradle --no-daemon --console=plain clean compileJava compileTestJava
