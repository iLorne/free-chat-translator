name: Private v0.7.0 Java 11 build verification

on:
  push:
    branches:
      - private-build-verification-v0.7.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java11-compile:
    name: Compile RuneLite plugin (no gameplay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle 8.14.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.7'
      - name: Compile plugin and test harness with actual dependencies
        run: gradle --no-daemon --console=plain clean compileJava compileTestJava
